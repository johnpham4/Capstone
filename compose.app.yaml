services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: diagsys-api
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
      IMAGE_STORAGE_BACKEND: local
      LOCAL_MEDIA_ROOT_DIR: /app/output
      LOCAL_MEDIA_BASE_URL: /output
      LOCAL_MEDIA_PUBLIC_BASE_URL: http://localhost:8000
      SOURCE_IMAGE_OUTPUT_DIR: /app/output/source-images
    volumes:
      - ./output:/app/output
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - diagsys

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: diagsys-worker
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
      IMAGE_STORAGE_BACKEND: local
      LOCAL_MEDIA_ROOT_DIR: /app/output
      LOCAL_MEDIA_BASE_URL: /output
      LOCAL_MEDIA_PUBLIC_BASE_URL: http://localhost:8000
      SOURCE_IMAGE_OUTPUT_DIR: /app/output/source-images
    volumes:
      - ./output:/app/output
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - diagsys

  flower:
    build:
      context: .
      dockerfile: Dockerfile
      target: flower
    container_name: diagsys-flower
    ports:
      - "5555:5555"
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - diagsys

networks:
  diagsys:
    driver: bridge
