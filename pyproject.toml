[project]
name = "geouni"
version = "0.1.0"
description = "A Unified Model for Generating Geometry Diagrams, Problems and Problem Solutions"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch==2.5.1",
    "torchvision==0.20.1",
    "transformers==4.49.0",
    "peft==0.14.0",
    "numpy>=1.26.0,<2.0",
    "pillow==10.3.0",
    "einops==0.6.0",
    "diffusers==0.30.1",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "loguru>=0.7.0",
    "click>=8.0.1",
    "dill>=0.3.8",
    "datasets>=4.4.1",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.7.2",
    "langchain>=1.2.0",
    "langchain-core>=1.2.5",
    "huggingface-hub>=0.36.0",
    "langchain-openai>=1.1.6",
    "tiktoken>=0.12.0",
    "boto3>=1.42.24",
    "sagemaker>=2.0,<3.0",
    "botocore[crt]>=1.42.24",
    "celery>=5.6.2",
    "flower>=2.0.1",
    "redis>=7.1.0",
    "psycopg2>=2.9.11",
    "cryptography>=46.0.4",
    "asyncpg>=0.31.0",
    "pwdlib[argon2]>=0.3.0",
    "alembic>=1.15.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_src"]

[dependency-groups]
pipeline = [
    "zenml[server]>=0.93.2",
]
