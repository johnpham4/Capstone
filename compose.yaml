version: "3.9"

services:
  # ===================== APP =====================
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: diagsys-api
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
      IMAGE_STORAGE_BACKEND: local
      LOCAL_MEDIA_ROOT_DIR: /app/output
      LOCAL_MEDIA_BASE_URL: /output
      LOCAL_MEDIA_PUBLIC_BASE_URL: http://localhost:8000
      SOURCE_IMAGE_OUTPUT_DIR: /app/output/source-images
    volumes:
      - ./output:/app/output
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - diagsys

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: diagsys-worker
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./output:/app/output
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - diagsys

  flower:
    build:
      context: .
      dockerfile: Dockerfile
      target: flower
    container_name: diagsys-flower
    ports:
      - "5555:5555"
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - diagsys

  # ===================== INFRA =====================
  postgres:
    image: postgres:16-alpine
    container_name: diaguni-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: capstone
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - diagsys

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: diaguni-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - diagsys

  redis:
    image: redis:7-alpine
    container_name: diaguni-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - diagsys

# ===================== VOLUMES =====================
volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:

# ===================== NETWORK =====================
networks:
  diagsys:
    driver: bridge