services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: geouni-api
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - geo

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: geouni-worker
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - geo

  flower:
    build:
      context: .
      dockerfile: Dockerfile
      target: flower
    container_name: geouni-flower
    ports:
      - "5555:5555"
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - geo

networks:
  geo:
    driver: bridge
